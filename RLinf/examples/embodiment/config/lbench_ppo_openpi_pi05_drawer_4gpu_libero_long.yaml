# Four-GPU single-task adaptation of the pinned LIBERO-Long Pi0.5 PPO recipe.
# Derived from the validated three-GPU drawer profile; retained resource and
# precision differences are documented in docs/LBENCH_DRAWER_FOUR_GPU_LIBERO_LONG_ZH.md.
# max_episode_steps=900 is the real limit; the 960-step window adds masked padding.
# Keep the original SFT execution protocol: execute 20 actions, denoise 10 times.
# User-selected microbatch 32 with four environments per GPU.
# Global batch 256 uses two accumulations per actor; one colocated round verified.
# See the companion document for measured memory, timing, and KL-limited updates.
defaults:
- env/lbench@env.train
- env/lbench@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/bucket_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3
runner:
  task_type: embodied
  actor_first_initialization: true
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: lbench_ppo_drawer_4gpu_libero_long
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 1000
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  max_saved_checkpoints: 1
  max_consecutive_zero_success: 3
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  # The pinned OpenPI worker does not forward these options to its loss.
  clip_ratio_c: null
  clip_log_ratio_min: null
  clip_log_ratio_max: null
  ppo_update_guard:
    enabled: true
    target_kl: 0.02
    max_initial_logratio: 0.01
    probe_batch_size: 64
    skip_actor_on_zero_reward: true
    loss_weighting: libero_trajectory
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  bootstrap_type: standard
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  balanced_rl: true
env:
  group_name: EnvGroup
  train:
    total_num_envs: 16
    rollout_epoch: 4
    backend_config:
      simbox_eval_config:
        cpu_thread_limit: 4
    task_indices:
    - 6
    seed: 1000
    isaac_cuda_visible_devices:
    - 0
    - 1
    - 2
    - 3
    isaac_gpu_assignment: env_rank
    connect_timeout_s: 300
    # Stage two INITs per rank to limit simultaneous native thread-pool creation.
    startup_batch_size: 2
    startup_timeout_s: 1200
    request_timeout_s: 300
    auto_reset: false
    ignore_terminations: false
    is_eval: false
    run_id: rlinf-lbench-ppo-4gpu-libero-long
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 960
    task_sampling: balanced_round_robin
    reward_adapter:
      type: libero_sparse_success
      success_bonus: ${algorithm.reward_coef}
    data_collection:
      enabled: false
      save_dir: ${runner.logger.log_path}/episodes/train
      export_format: pickle
      only_success: false
      fps: 30
  eval:
    total_num_envs: 4
    rollout_epoch: 1
    backend_config:
      simbox_eval_config:
        cpu_thread_limit: 4
    task_indices:
    - 6
    fixed_seeds:
    - 0
    - 1
    - 2
    - 3
    seed: 0
    isaac_cuda_visible_devices:
    - 0
    - 1
    - 2
    - 3
    isaac_gpu_assignment: env_rank
    connect_timeout_s: 300
    startup_batch_size: 2
    startup_timeout_s: 1200
    request_timeout_s: 300
    auto_reset: false
    ignore_terminations: false
    is_eval: true
    run_id: rlinf-lbench-eval
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 900
    task_sampling: balanced_round_robin
    use_fixed_reset_state_ids: true
    data_collection:
      enabled: false
      save_dir: ${runner.logger.log_path}/episodes/eval
      export_format: pickle
      only_success: false
      fps: 30
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:LBENCH_SFT_CHECKPOINT}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  log_optimizer_progress: true
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42
  enable_offload: true
  rollout_state_dict_cpu_offload: true
  model:
    model_path: ${oc.env:LBENCH_SFT_CHECKPOINT}
    model_type: openpi
    num_action_chunks: 20
    action_dim: 8
    add_value_head: true
    use_proprio: true
    num_steps: 10
    openpi_data:
      lerobot_compatible: true
      norm_stats_path: ${oc.env:LBENCH_NORM_STATS}
    openpi:
      config_name: pi05_lbench_joint
      parameter_precision: float32
      strict_ppo_precision: true
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      num_steps: ${..num_steps}
      train_expert_only: true
      noise_method: flow_sde
      noise_level: 0.5
      add_value_head: true
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
  optim:
    lr: 1.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: 1000
    min_lr_rate: 0.1
    lr_scheduler: cosine
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    save_full_model_weights: true
    checkpoint_cpu_staging: true
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
