defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: lbench_sft_openpi_pi05
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 5000
  resume_dir: null

data:
  # Local LeRobot dataset root or Hugging Face repo id. The dataset storage
  # format must match the LeRobot loader installed with OpenPI. The current
  # rlinf-openpi==0.1.1 environment uses lerobot==0.3.3 / LeRobot v2.1.
  train_data_paths: ${oc.env:LBENCH_LEROBOT_REPO}
  num_workers: 4

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 0
  model:
    model_path: ${oc.env:PI05_BASE_CHECKPOINT}
    model_type: openpi
    # OpenPI manages its own selected bf16 parameters. Keep this null, matching
    # RLinf's Pi0.5 model contract.
    precision: null
    num_action_chunks: 50
    action_dim: 8
    add_value_head: false
    use_proprio: true
    # Inference-only Euler steps bundled with the trained model. SFT samples
    # one continuous flow time per example; keep deployment aligned to LeRobot.
    num_steps: 10
    openpi:
      config_name: pi05_lbench_joint
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      num_steps: ${..num_steps}
      # Full-parameter SFT is the reference recipe. On a single 32 GB GPU use
      # the documented train_expert_only=true override; this freezes the
      # PaliGemma VLM while training the action expert and projections.
      train_expert_only: false
      add_value_head: false
    # The exact same file is required by SFT, eval, and PPO. It is generated by:
    # python toolkits/lerobot/calculate_norm_stats.py --config-name \
    #   pi05_lbench_joint --repo-id "$LBENCH_LEROBOT_REPO" \
    #   --output-dir /path/to/lbench_norm_stats
    openpi_data:
      repo_id: ${oc.env:LBENCH_LEROBOT_REPO}
      norm_stats_path: ${oc.env:LBENCH_NORM_STATS}
  optim:
    lr: 2.5e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    # Keep the optimizer schedule aligned when runner.max_steps is overridden.
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    # The 96 GB single-GPU profile has sufficient memory without recomputation.
    # The OpenPI wrapper honors this flag and leaves expert checkpointing off.
    gradient_checkpointing: false
    save_full_model_weights: true
    mixed_precision:
      # Preserve OpenPI's native mixed dtypes: the PaliGemma/action-expert
      # backbone selects bf16 internally, while the flow-matching projections
      # and inputs remain fp32. A global FSDP bf16 cast breaks both image
      # augmentation (grid_sample) and action projection (linear) dtypes.
      param_dtype: null
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false

critic:
  use_critic_model: false
