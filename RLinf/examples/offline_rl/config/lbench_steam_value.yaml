defaults:
- model/steam_value_model@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1
runner:
  task_type: sft
  logger:
    log_path: /root/autodl-tmp/outputs/lbench_steam
    project_name: rlinf
    experiment_name: lbench_steam_k32_e3
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 16000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null
  max_saved_checkpoints: 3
data:
  train_data_paths:
  - dataset_path: /root/autodl-tmp/datasets/lbench_8tasks_all_merge_simple_v21_merged
    type: sft
  balance_weights: true
  seed: 42
  dataset_type: sft
  camera_keys:
  - observation.images.obs_camera
  - observation.images.obs_camera_2
  - observation.images.realsense
  k: 32
  only_success: true
  min_episode_length: null
  train_num_workers: 2
  eval_num_workers: 4
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: false
  do_augment: false
  length_scale_enabled: true
  length_scale_percentile: 90.0
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 64
  seed: 0
  model:
    precision: fp32
    fusion_hidden_dim: 512
    dropout: 0.1
    label_smoothing: 0.05
    num_frames_per_pair: 2
    num_bins: 32
    vision_repo_id: /root/autodl-tmp/models/siglip-so400m-patch14-384
    language_repo_id: /root/autodl-tmp/models/gemma-3-270m
    tokenizer_path: /root/autodl-tmp/models/gemma-3-270m
    freeze_vision_encoder: false
    freeze_language_model: false
    include_state_in_prompt: false
    max_state_dim: 32
    state_discretization_bins: 256
    max_token_len: 200
    ensemble_size: 3
    ensemble_head_seed_base: 0
    use_gradient_checkpointing: true
  optim:
    lr: 5.0e-05
    value_lr: 5.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-05
    clip_grad: 10.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: 16000
    min_lr: 1.0e-06
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
reward:
  use_reward_model: false
critic:
  use_critic_model: false
