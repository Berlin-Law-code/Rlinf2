# LBench RECAP: shared prepared data and episode-weighted LeRobot norm.
defaults:
- lbench_recap_datasets@data
- model/recap_value_model@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1
runner:
  task_type: sft
  logger:
    log_path: ${oc.env:LBENCH_RECAP_OUTPUT,/root/autodl-tmp/outputs/lbench_recap_round1}
    project_name: rlinf
    experiment_name: value
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 8000
  val_check_interval: -1
  save_interval: 1000
  max_saved_checkpoints: 3
  resume_dir: null
data:
  tag: lbench_round1_fail300
  eval_data_paths: []
  train_num_workers: 8  # Per rank: 16 DataLoader workers across two GPUs.
  eval_num_workers: 4
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: false
  include_state: false
  gamma: 1.0
  action_horizon: 20
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 32
  robot_type: lbench
  model_type: pi05
  balance_weights: true
  seed: 42
  do_augment: false
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 256
  log_memory_usage: true
  seed: 0
  model:
    precision: fp32
    siglip_path: /root/autodl-tmp/models/siglip2-so400m-patch14-224
    gemma3_path: /root/autodl-tmp/models/gemma-3-270m
    tokenizer_path: /root/autodl-tmp/models/gemma-3-270m
    freeze_vlm: false
    action_dim: 32
    action_horizon: 20
  optim:
    lr: 5.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: 8000
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    save_full_model_weights: true
    amp_autocast:
      enabled: true
      precision: bf16
reward:
  use_reward_model: false
critic:
  use_critic_model: false
