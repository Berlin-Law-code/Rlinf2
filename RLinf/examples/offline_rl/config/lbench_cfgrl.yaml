defaults:
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1
runner:
  task_type: sft
  logger:
    log_path: /root/autodl-tmp/outputs/lbench_cfgrl
    project_name: rlinf
    experiment_name: lbench_cfgrl_h50_e20
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 5000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null
  max_saved_checkpoints: 3
data:
  num_workers: 2
  advantage_tag: lbench_steam_k32_e3_v1
  balance_dataset_weights: false
  seed: 42
  train_data_paths:
  - dataset_path: /root/autodl-tmp/datasets/lbench_8tasks_all_merge_simple_v21_merged
    type: sft
    weight: 1.0
  - dataset_path: /root/autodl-tmp/datasets/steam_rollout_v21
    type: rollout
    weight: 1.0
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 64
  seed: 0
  model:
    precision: null
    model_path: /root/autodl-tmp/outputs/lbench_all_merge_simple_sft_h50_e20_lerobot_norm_20261001_120113/lbench_all_merge_simple_pi05_h50_e20_lerobot_norm/checkpoints/global_step_30000
    model_type: cfg_model
    add_value_head: false
    openpi:
      config_name: pi05_lbench_joint
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.1
      train_expert_only: false
      guidance_type: positive
      positive_only_conditional: true
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: 20
      action_env_dim: 8
      num_steps: 10
      parameter_precision: float32
      sft_image_augmentation: false
    action_dim: 8
    num_action_chunks: 20
    num_steps: 10
    openpi_data:
      norm_stats_path: /root/autodl-tmp/outputs/lbench_all_merge_simple_sft_h50_e20_lerobot_norm_20261001_120113/lbench_all_merge_simple_pi05_h50_e20_lerobot_norm/checkpoints/global_step_30000/lerobot_meta_stats/norm_stats.json
      lerobot_compatible: true
  optim:
    lr: 5.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 500
    total_training_steps: 5000
    min_lr: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    save_full_model_weights: true
    amp_autocast:
      enabled: true
      precision: bf16
reward:
  use_reward_model: false
critic:
  use_critic_model: false
